<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 275 210" role="img" aria-labelledby="title desc">
<title id="title">Planned universal breadboard mounting plate, 180 by 120 by 3 mm</title><desc id="desc">Dimensioned top and side view of a rounded rectangle plate with six twenty by four millimeter strap slots. Breadboard fit envelope is hypothetical and must be checked before fabrication.</desc>
<defs><marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10 0L0 5L10 10" fill="none" stroke="#334e5c" stroke-width="1.5"/></marker></defs>
<rect width="275" height="210" fill="white"/>
<g font-family="Segoe UI,sans-serif" fill="#183340"><text x="14" y="12" font-size="5" font-weight="bold">UNIVERSAL BREADBOARD PLATE · REV A</text><text x="14" y="20" font-size="3.5" fill="#a12836">PLANNED / NOT_FABRICATED · all dimensions mm · scale schematic</text></g>
<g transform="translate(40 42)">
<rect x="0" y="0" width="180" height="120" rx="6" fill="#edf3f5" stroke="#183340" stroke-width=".65"/>
<g fill="white" stroke="#183340" stroke-width=".4"><rect x="18" y="25" width="4" height="20" rx="2"/><rect x="158" y="25" width="4" height="20" rx="2"/><rect x="18" y="75" width="4" height="20" rx="2"/><rect x="158" y="75" width="4" height="20" rx="2"/><rect x="68" y="2" width="4" height="20" rx="2"/><rect x="108" y="2" width="4" height="20" rx="2"/></g>
<rect x="40" y="25" width="100" height="70" rx="2" fill="none" stroke="#176298" stroke-width=".4" stroke-dasharray="2 1"/>
<g font-family="Segoe UI,sans-serif" font-size="3.2" fill="#183340" text-anchor="middle"><text x="90" y="49">ASSUMED BREADBOARD ENVELOPE</text><text x="90" y="55">100 × 70 maximum; verify actual part</text><text x="90" y="64">Straps retain breadboard base</text><text x="90" y="70">No strap over Pico components / headers</text><text x="90" y="91">No precision PCB hole fit asserted</text></g>
<path d="M35 35H145M35 85H145" stroke="#a54816" stroke-width="1" stroke-dasharray="3 1"/>
<path d="M90 24V-7" stroke="#126d5c" stroke-width="1.5"/><text x="98" y="-4" font-family="Segoe UI,sans-serif" font-size="3.2" fill="#126d5c">USB corridor / BOOTSEL access</text>
<g fill="none" stroke="#334e5c" stroke-width=".3"><path d="M0 -5V-15M180 -5V-15M0 -12H180" marker-start="url(#dim)" marker-end="url(#dim)"/><path d="M-5 0H-20M-5 120H-20M-17 0V120" marker-start="url(#dim)" marker-end="url(#dim)"/><path d="M20 123V133M160 123V133M20 130H160" marker-start="url(#dim)" marker-end="url(#dim)"/><path d="M185 35H197M185 85H197M194 35V85" marker-start="url(#dim)" marker-end="url(#dim)"/></g>
<g font-family="Segoe UI,sans-serif" font-size="3.5" fill="#183340" text-anchor="middle"><text x="90" y="-14">180 ±0.5</text><text x="-21" y="60" transform="rotate(-90 -21 60)">120 ±0.5</text><text x="90" y="128">140 centre distance</text><text x="198" y="60" transform="rotate(-90 198 60)">50 centre distance</text></g>
<path d="M20 25L30 9H52" fill="none" stroke="#334e5c" stroke-width=".3"/><text x="32" y="6" font-family="Segoe UI,sans-serif" font-size="3.2">6 × slot 20 × 4, R2 ends</text>
</g>
<g font-family="Segoe UI,sans-serif" font-size="3.2" fill="#183340"><text x="14" y="183">MATERIAL: 3 mm birch plywood assumed; deburr edges. Slot width 4 +0.5/−0 mm after trial coupon.</text><text x="14" y="190">Slot centre coordinates (from top-left): (20,35), (160,35), (20,85), (160,85), (70,12), (110,12).</text><text x="14" y="197">Adhesive feet under plate provide ≥5 mm strap clearance; cable service loop, no connector load.</text><text x="14" y="204">FIT CHECK REQUIRED: actual breadboard, connectors, strap width, component heights and fabrication process.</text></g>
<g transform="translate(229 95)" font-family="Segoe UI,sans-serif" font-size="3.2" fill="#183340"><rect width="30" height="3" fill="#e5cfa4" stroke="#334e5c" stroke-width=".4"/><path d="M34 0H39M34 3H39" stroke="#334e5c" stroke-width=".3"/><text x="0" y="12">SIDE VIEW</text><text x="0" y="18">3 nominal thickness</text><text x="0" y="24">±0.3 assumed stock</text><text x="0" y="30">NOT MEASURED</text></g>
</svg>
