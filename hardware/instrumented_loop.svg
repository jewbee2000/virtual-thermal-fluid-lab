<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" role="img" aria-labelledby="title desc">
<title id="title">Planned instrumentation of the virtual thermal loop</title><desc id="desc">Conceptual flow loop with hot wall, hot inventory, pump, cooled inventory and heat sink, instrument locations and separate wall trip. Pico demonstration emulates a tank and does not connect actuators or build this thermal rig.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#476572"/></marker></defs>
<rect width="1120" height="440" fill="#fff"/>
<g font-family="Segoe UI,sans-serif" fill="#183340"><text x="25" y="35" font-size="23" font-weight="bold">Thermal loop / instrument concept</text><text x="25" y="63" font-size="14" fill="#a12836">PLANNED · NOT_FABRICATED · no 5 kW hardware or connected actuators</text></g>
<path d="M125 190H1000V305H125V190" stroke="#476572" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<rect x="45" y="130" width="175" height="120" rx="10" fill="#e7f0f6" stroke="#1266a2" stroke-width="2"/><circle cx="302" cy="190" r="30" fill="#e5edf0" stroke="#476572" stroke-width="2"/>
<rect x="460" y="120" width="190" height="140" rx="10" fill="#f9e4d8" stroke="#ad3c19" stroke-width="2"/><rect x="476" y="166" width="158" height="76" rx="8" fill="#fff8e7" stroke="#b77300"/>
<path d="M739 173L769 207L799 173V207L769 173L739 207Z" fill="#e5edf0" stroke="#476572" stroke-width="2"/>
<rect x="882" y="130" width="175" height="120" rx="10" fill="#eaf0ef" stroke="#66847f" stroke-width="2"/>
<g font-family="Segoe UI,sans-serif" text-anchor="middle" fill="#183340" font-size="14"><text x="132" y="170">Cooled inventory</text><text x="132" y="209">TT-02 · cold K</text><text x="302" y="140">Pump</text><text x="555" y="150">Wall · TT-03 · K</text><text x="555" y="209">Hot liquid · TT-01 · K</text><text x="769" y="143">Valve</text><text x="969" y="170">Heat sink</text><text x="969" y="215">Cooling boundary</text></g>
<g stroke="#476572" fill="#fff" stroke-width="2"><circle cx="381" cy="190" r="25"/><circle cx="555" cy="88" r="23"/><circle cx="702" cy="265" r="24"/></g>
<g font-family="Segoe UI,sans-serif" text-anchor="middle" fill="#183340" font-size="12"><text x="381" y="194">FT-01</text><text x="555" y="92">TSHH</text><text x="702" y="269">PT-01</text></g>
<path d="M555 111V120M702 241V190" stroke="#476572" stroke-width="2" stroke-dasharray="5 3"/><text x="583" y="90" font-family="Segoe UI,sans-serif" font-size="12" fill="#183340">Separate wall trip, assumed 358.15 K</text>
<text x="325" y="282" font-family="Segoe UI,sans-serif" font-size="12" fill="#183340">FT-01: volume flow m³/s. PT-01: pressure; pump differential needs inlet + outlet references.</text>
<rect x="25" y="333" width="1070" height="86" rx="8" fill="#f0f4f5"/>
<g font-family="Segoe UI,sans-serif" font-size="13" fill="#183340"><text x="43" y="356">Pico peripheral demonstration is a separate tank-emulation experiment: GP26 voltage → assumed level; GP14 trip.</text><text x="43" y="380">GP15 ARM / GP16 RESET; GP25 indicator only. Actual thermal instrumentation requires ranges, calibration and uncertainty.</text><text x="43" y="403">Physical validation NOT_STARTED · board execution NOT_EXECUTED · this diagram locates potential measurements.</text></g>
</svg>
