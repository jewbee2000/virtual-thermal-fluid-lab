[project]
name = "virtual-fluid-lab"
version = "0.1.0"
description = "Educational fluid plant and software-in-the-loop verification bench"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "matplotlib==3.10.8"]

[project.scripts]
fluidlab = "fluidlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluidlab"]
